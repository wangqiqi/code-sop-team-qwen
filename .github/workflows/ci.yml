name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 校验 · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 四道闸回归（43 用例，零依赖）
        run: python code-sop-team/tests/test_sop_gate.py

      - name: 套件结构校验
        run: python tools/validate_kit.py

      - name: 打包干跑（可复现 ZIP）
        id: build
        run: python tools/build_kit.py --out build/dist

      - name: 打包复跑一致性
        run: python tools/check_reproducible.py

      - name: 上传构建产物
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: code-sop-team-zip
          path: build/dist/*.zip
          if-no-files-found: error
          retention-days: 14